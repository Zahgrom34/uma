# Builds the storefront and publishes it to GitHub Pages.
# Set the repository variable VITE_API_URL (Settings → Secrets and variables →
# Actions → Variables) to the Railway service URL, e.g. https://uma-api.up.railway.app
name: storefront

on:
  push:
    branches: [main]
    paths:
      - 'umabranduz/**'
      - '.github/workflows/storefront.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: umabranduz/package-lock.json
      - run: npm ci
        working-directory: umabranduz
      - run: npm run build
        working-directory: umabranduz
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: umabranduz/dist
      - id: deployment
        uses: actions/deploy-pages@v4
